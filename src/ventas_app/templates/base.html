<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ventas Obra Social{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between gap-4 px-4 py-4">
      <div>
        <p class="text-xs font-semibold uppercase tracking-wide text-blue-600">Obra Social</p>
        <h1 class="text-xl font-bold">Carga de ventas</h1>
      </div>
      <span class="rounded-full bg-blue-50 px-3 py-1 text-xs font-medium text-blue-700">
        Wizard de 3 etapas
      </span>
    </div>
  </header>

  {% block content %}{% endblock %}

  <footer class="mx-auto max-w-5xl px-4 py-8 text-center text-xs text-slate-500">
    Uso interno · Los datos se guardan al confirmar la venta
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
