<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ventas Obra Social{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Public+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="{{ url_for('static', path='css/design.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen">
  <header class="app-header">
    <div class="app-header__inner">
      <a class="brand" href="/" aria-label="Obra Social, ir a nueva venta">
        <span class="brand__mark" aria-hidden="true">✓</span>
        <span>
          <span class="brand__name">Obra Social</span>
          <span class="brand__sub">Altas y auditoría</span>
        </span>
      </a>

      <nav class="app-nav" aria-label="Navegación principal">
        <a
          href="/"
          class="app-nav__link{% if request.url.path == '/' %} app-nav__link--active{% endif %}"
          {% if request.url.path == '/' %}aria-current="page"{% endif %}
        >
          Nueva venta
        </a>
        <a
          href="/ventas"
          class="app-nav__link{% if request.url.path == '/ventas' %} app-nav__link--active{% endif %}"
          {% if request.url.path == '/ventas' %}aria-current="page"{% endif %}
        >
          Panel
        </a>
        <a
          href="/dashboard"
          class="app-nav__link{% if request.url.path == '/dashboard' %} app-nav__link--active{% endif %}"
          {% if request.url.path == '/dashboard' %}aria-current="page"{% endif %}
        >
          Tablero
        </a>
      </nav>

      <span class="app-header__note">Uso interno</span>
    </div>
  </header>

  {% block content %}{% endblock %}

  <footer class="app-footer">
    Uso interno. Los datos se guardan al confirmar la venta.
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
