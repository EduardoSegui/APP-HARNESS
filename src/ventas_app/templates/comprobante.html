<section id="comprobante" class="hidden">
  <div class="mx-auto max-w-2xl overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-200">
    <div class="bg-blue-600 px-6 py-5 text-white">
      <p class="text-sm font-medium text-blue-100">Comprobante de venta</p>
      <h2 class="mt-1 text-2xl font-bold">Venta <span id="comprobante-id"></span></h2>
      <p id="comprobante-estado" class="mt-2 inline-block rounded-full bg-blue-500 px-3 py-1 text-xs font-semibold"></p>
    </div>

    <div class="space-y-5 p-6">
      <dl class="grid gap-4 sm:grid-cols-2">
        <div>
          <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Titular</dt>
          <dd id="comprobante-titular" class="mt-1 font-medium text-slate-900"></dd>
        </div>
        <div>
          <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Plan</dt>
          <dd id="comprobante-plan" class="mt-1 font-medium text-slate-900"></dd>
        </div>
        <div>
          <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Fecha</dt>
          <dd id="comprobante-fecha" class="mt-1 font-medium text-slate-900"></dd>
        </div>
        <div>
          <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Adherentes</dt>
          <dd id="comprobante-adherentes" class="mt-1 font-medium text-slate-900"></dd>
        </div>
      </dl>

      <div class="rounded-lg bg-slate-50 p-4">
        <div class="flex flex-wrap justify-between gap-2 text-sm">
          <span class="text-slate-600">Desglose</span>
          <span id="comprobante-desglose" class="font-medium text-slate-900"></span>
        </div>
        <div class="mt-3 flex justify-between gap-2 border-t border-slate-200 pt-3">
          <span class="font-semibold text-slate-900">Total</span>
          <span id="comprobante-total" class="text-lg font-bold text-blue-700"></span>
        </div>
      </div>

      <p class="text-xs text-slate-500">
        La venta quedó pendiente de verificación por el agente auditor.
      </p>

      <button
        type="button"
        id="btn-nueva-venta"
        class="w-full rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300"
      >
        Cargar otra venta
      </button>
    </div>
  </div>
</section>
