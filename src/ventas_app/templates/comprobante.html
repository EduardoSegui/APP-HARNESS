<section id="comprobante" class="hidden" aria-live="polite">
  <div class="constancia">
    <div class="constancia__head">
      <p class="constancia__kicker">Comprobante de venta</p>
      <h2 class="constancia__title">Venta <span id="comprobante-id"></span></h2>
    </div>

    <div class="constancia__body">
      <div class="constancia__status-row">
        <p class="constancia__note">La venta quedó registrada y pasa a verificación del agente auditor.</p>
        <span id="comprobante-estado" class="stamp"></span>
      </div>

      <dl class="detail-grid">
        <div>
          <dt>Titular</dt>
          <dd id="comprobante-titular"></dd>
        </div>
        <div>
          <dt>Plan</dt>
          <dd id="comprobante-plan"></dd>
        </div>
        <div>
          <dt>Fecha</dt>
          <dd id="comprobante-fecha"></dd>
        </div>
        <div>
          <dt>Adherentes</dt>
          <dd id="comprobante-adherentes"></dd>
        </div>
      </dl>

      <div class="credential">
        <div class="credential__rows">
          <div class="credential__row">
            <span class="credential__label">Desglose</span>
            <span id="comprobante-desglose" class="credential__value"></span>
          </div>
        </div>
        <div class="credential__total">
          <span class="credential__total-label">Total</span>
          <span id="comprobante-total" class="credential__total-value"></span>
        </div>
      </div>

      <div class="constancia__actions">
        <a
          id="enlace-panel-ventas"
          href="/ventas"
          class="btn btn--primary"
        >
          Ir al panel de ventas
        </a>
        <button
          type="button"
          id="btn-nueva-venta"
          class="btn btn--secondary"
        >
          Cargar otra venta
        </button>
      </div>
    </div>
  </div>
</section>
