name: security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.8"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sincronizar lockfile
        run: uv sync --locked --all-groups

      - name: Verificar lockfile
        run: uv lock --check

      - name: Auditar dependencias
        run: uv run pip-audit --progress-spinner off

      - name: Bandit (High/Critical)
        run: uv run bandit -q -r src -lll

      - name: Semgrep
        run: uvx semgrep==1.186.0 --config .semgrep.yml --error --quiet

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tests
        run: uv run pytest

      - name: Gate local complementario
        run: uv run python scripts/security_gate.py
