[project]
name = "ventas-obra-social"
version = "0.1.0"
description = "Aplicación web de carga de ventas para obra social con validación agéntica vía MCP"
readme = "README.md"
authors = [
    { name = "EduardoSegui", email = "edus_55@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mcp>=2.3.0",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ventas_app"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
